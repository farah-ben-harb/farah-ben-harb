<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes GitOps delivery architecture</title>
  <desc id="desc">Source code is validated by CI, packaged to a registry, represented as desired state in a GitOps repository, reconciled by Argo CD and observed by Prometheus and Grafana.</desc>
  <rect width="1200" height="300" rx="18" fill="#080D17"/>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.label{fill:#E9F1F8;font-size:15px}.meta{fill:#9FB4C8;font-size:12px}.line{stroke:#62DCEB;stroke-width:2;fill:none}.box{fill:#111C2E;stroke:#31506D;stroke-width:1.5}</style>
  <text x="32" y="34" fill="#62DCEB" font-size="14" letter-spacing="3">DELIVERY CONTROL LOOP / GITOPS</text>
  <g class="line"><path d="M165 140H235M385 140H455M605 140H675M825 140H895M1045 140H1120"/></g>
  <g fill="#62DCEB"><circle cx="235" cy="140" r="4"/><circle cx="455" cy="140" r="4"/><circle cx="675" cy="140" r="4"/><circle cx="895" cy="140" r="4"/><circle cx="1120" cy="140" r="4"/></g>
  <g class="box"><rect x="35" y="106" width="130" height="68" rx="10"/><rect x="235" y="106" width="150" height="68" rx="10"/><rect x="455" y="106" width="150" height="68" rx="10"/><rect x="675" y="106" width="150" height="68" rx="10"/><rect x="895" y="106" width="150" height="68" rx="10"/><rect x="1120" y="106" width="50" height="68" rx="10"/></g>
  <g class="label" text-anchor="middle"><text x="100" y="135">SOURCE</text><text x="100" y="156">CODE</text><text x="310" y="135">CI GATES</text><text x="310" y="156">TEST · SCAN</text><text x="530" y="135">REGISTRY</text><text x="530" y="156">GHCR / IMAGE</text><text x="750" y="135">GITOPS</text><text x="750" y="156">MANIFESTS</text><text x="970" y="135">ARGO CD</text><text x="970" y="156">RECONCILE</text><text x="1145" y="135">K8S</text><text x="1145" y="156">↺</text></g>
  <path d="M970 190V235H750V190" stroke="#31506D" stroke-width="1.5" fill="none" stroke-dasharray="5 6"/><text x="860" y="255" fill="#62DCEB" font-size="12" text-anchor="middle">desired state loop</text>
  <text x="32" y="282" class="meta">Prometheus / Grafana observe the reconciled workloads; CI does not need broad cluster credentials.</text>
</svg>
