<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenStack private cloud automation architecture</title>
  <desc id="desc">Heat provisions OpenStack network, compute and storage resources. Ansible bootstraps Kubernetes with containerd, kubeadm and Calico. A separate FastAPI service reads Prometheus metrics for anomaly detection.</desc>
  <rect width="1200" height="300" rx="18" fill="#080D17"/>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.label{fill:#E9F1F8;font-size:15px}.meta{fill:#9FB4C8;font-size:12px}.line{stroke:#62DCEB;stroke-width:2;fill:none}.box{fill:#111C2E;stroke:#31506D;stroke-width:1.5}</style>
  <text x="32" y="34" fill="#62DCEB" font-size="14" letter-spacing="3">PRIVATE CLOUD / AUTOMATION LAYERS</text>
  <g class="line"><path d="M170 140H245M400 140H475M630 140H705M860 140H935"/><path d="M1010 174V220H780" stroke-dasharray="5 6"/></g>
  <g fill="#62DCEB"><circle cx="245" cy="140" r="4"/><circle cx="475" cy="140" r="4"/><circle cx="705" cy="140" r="4"/><circle cx="935" cy="140" r="4"/></g>
  <g class="box"><rect x="35" y="106" width="135" height="68" rx="10"/><rect x="245" y="106" width="155" height="68" rx="10"/><rect x="475" y="106" width="155" height="68" rx="10"/><rect x="705" y="106" width="155" height="68" rx="10"/><rect x="935" y="106" width="150" height="68" rx="10"/><rect x="620" y="220" width="160" height="48" rx="10"/></g>
  <g class="label" text-anchor="middle"><text x="102" y="135">HEAT</text><text x="102" y="156">TEMPLATES</text><text x="322" y="135">NEUTRON</text><text x="322" y="156">NETWORKING</text><text x="552" y="135">NOVA + CINDER</text><text x="552" y="156">COMPUTE / STORAGE</text><text x="782" y="135">ANSIBLE</text><text x="782" y="156">BOOTSTRAP</text><text x="1010" y="135">K8S</text><text x="1010" y="156">KUBEADM / CALICO</text><text x="700" y="241">ANOMALY SERVICE</text><text x="700" y="258">FASTAPI + PROMETHEUS</text></g>
  <text x="32" y="282" class="meta">OpenStack labs, cluster automation and anomaly detection are related components with separate repository boundaries.</text>
</svg>
